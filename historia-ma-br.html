<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1b2e">
<title>Mini-Raio PMMA 2026 — História do Maranhão + História do Brasil</title>
<style>

:root{
  --bg:#0d1b2e; --bg-2:#122540; --panel:#16304f; --line:#2a4a70;
  --gold:#c9a24a; --gold-dim:#8a7433; --gold-soft:rgba(201,162,74,.12);
  --certo:#4f9d69; --errado:#b5533f; --blank:#6b7c93;
  --ink:#eef2f6; --ink-dim:#a9bcd4;
  --serif:Georgia,'Times New Roman',serif;
  --sans:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0; height:auto; min-height:100%; overflow-x:hidden; overflow-y:auto; -webkit-overflow-scrolling:touch}
html{scroll-behavior:smooth}
body{
  background:radial-gradient(1200px 800px at 80% -10%,#17335a 0%,var(--bg) 55%);
  color:var(--ink); font-family:var(--sans); min-height:100vh;
  padding-bottom:calc(120px + var(--safe-b)); font-size:16px; line-height:1.55;
  position:static !important; /* never lock the page */
  touch-action:pan-y;
}
header{
  text-align:center; padding:28px 16px 18px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(201,162,74,.08),transparent);
  position:sticky; top:0; z-index:20; backdrop-filter:blur(8px);
  background-color:rgba(13,27,46,.92);
}
.badge{
  width:56px;height:56px;margin:0 auto 10px; border-radius:50%;
  border:2px solid var(--gold); display:flex;align-items:center;justify-content:center;
  font-family:var(--serif); font-weight:bold; font-size:20px; color:var(--gold);
  letter-spacing:1px;
  box-shadow:0 0 0 4px var(--gold-soft),0 0 20px rgba(201,162,74,.15);
}
h1{font-family:var(--serif); font-size:clamp(20px,4.2vw,30px); margin:0 0 4px; letter-spacing:.4px}
.subtitle{color:var(--ink-dim); font-size:12px; letter-spacing:1.4px; text-transform:uppercase}
.lawref{margin-top:8px; font-size:13px; color:var(--gold); font-style:italic}
.hdr-meta{display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:10px}
.chip{
  font-size:12px; padding:4px 10px; border-radius:999px;
  border:1px solid var(--line); background:var(--panel); color:var(--ink-dim);
  cursor:pointer; font-weight:600;
}
.chip.gold{border-color:var(--gold); color:var(--gold)}
.chip:empty{display:none}
.fs-btn{
  position:fixed; top:10px; right:10px; z-index:10050;
  width:40px; height:40px; border-radius:10px;
  border:1px solid var(--line); background:var(--panel); color:var(--ink);
  cursor:pointer; font-size:18px; line-height:1;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 14px rgba(0,0,0,.25);
}
.fs-btn:hover{border-color:var(--gold); color:var(--gold)}
.fs-btn:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
/* Expanded / fullscreen look — must NOT use position:fixed (it froze scrolling) */
body.is-immersive{
  position:static !important;
  width:auto; height:auto; min-height:100vh;
  overflow-x:hidden; overflow-y:auto !important;
  max-height:none !important;
}
body.is-immersive main{max-width:min(1100px,96vw); padding:22px 28px 0}
body.is-immersive .qtext{font-size:18.5px; line-height:1.7}
body.is-immersive .card{padding:28px 24px 22px}
body.is-immersive .opt-btn{min-height:64px; font-size:17px}
body.is-immersive header{padding-right:56px}
:fullscreen, :-webkit-full-screen{overflow-y:auto !important; height:auto !important; min-height:100%}
:fullscreen body, :-webkit-full-screen body{overflow-y:auto !important; position:static !important; height:auto !important; min-height:100vh}

main{max-width:780px; margin:0 auto; padding:18px 14px 0}
#quizBody{padding-bottom:8px}
#quizBody .card:last-child{margin-bottom:12px}
@media (min-width:900px){
  main{max-width:900px}
}
:fullscreen main, :-webkit-full-screen main{max-width:min(1100px,96vw); padding:22px 28px 0}
:fullscreen .qtext, :-webkit-full-screen .qtext{font-size:18.5px; line-height:1.7}
:fullscreen .card, :-webkit-full-screen .card{padding:28px 24px 22px}
:fullscreen .opt-btn, :-webkit-full-screen .opt-btn{min-height:64px; font-size:17px}
:fullscreen header, :-webkit-full-screen header{padding-right:56px}

.progress-wrap{display:flex; align-items:center; gap:12px; margin-bottom:14px}
.progress-track{
  flex:1; height:8px; background:var(--bg-2); border-radius:4px;
  overflow:hidden; border:1px solid var(--line);
}
.progress-fill{
  height:100%; width:0%;
  background:linear-gradient(90deg,var(--gold-dim),var(--gold));
  transition:width .35s ease;
}
.progress-label{font-size:13px; color:var(--ink-dim); white-space:nowrap; font-variant-numeric:tabular-nums}

.scoreboard{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px}
.score-box{
  background:var(--panel); border:1px solid var(--line); border-radius:8px;
  padding:10px 8px; text-align:center;
}
.score-box .num{font-family:var(--serif); font-size:22px; font-weight:bold}
.score-box .lbl{font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--ink-dim); margin-top:2px}
#numCertas{color:var(--certo)} #numErradas{color:var(--errado)} #numPendentes{color:var(--gold)}

.card{
  background:var(--panel); border:1px solid var(--line); border-radius:12px;
  padding:22px 18px 18px; margin-bottom:14px;
  box-shadow:0 8px 30px rgba(0,0,0,.25);
}
.qnum{
  font-family:var(--serif); color:var(--gold); font-size:12px;
  letter-spacing:1.2px; text-transform:uppercase; margin-bottom:8px;
}
.comando{font-size:13.5px; color:var(--ink-dim); margin-bottom:10px; font-style:italic}
.qtext{font-size:17px; line-height:1.68; margin-bottom:18px}
.warn{
  display:inline-block; font-size:12px; background:rgba(201,162,74,.15);
  color:var(--gold); border-radius:6px; padding:2px 8px; margin-bottom:10px; font-weight:700;
}
.ctx{
  background:var(--bg-2); border-left:3px solid var(--gold); border-radius:8px;
  padding:12px 14px; margin-bottom:16px; font-size:14.5px; color:var(--ink-dim);
  line-height:1.55;
}
.ctx summary{cursor:pointer; font-weight:700; color:var(--gold); margin-bottom:6px; user-select:none}
.ctx p{margin:8px 0}
.ctx .fonte{font-size:12px; text-align:right; opacity:.85}
.ctx .cmd{font-weight:700; color:var(--ink); font-style:normal}
.ctx .prop{font-style:italic; color:var(--ink)}

.options{display:flex; gap:10px; margin-bottom:8px}
.opt-btn{
  flex:1; padding:16px 10px; min-height:56px; font-size:16px; font-weight:700;
  letter-spacing:.6px; border-radius:10px; border:1px solid var(--line);
  background:var(--bg-2); color:var(--ink); cursor:pointer;
  transition:all .15s ease; font-family:var(--sans);
}
.opt-btn:hover:not(:disabled){border-color:var(--gold); background:#1c3454}
.opt-btn:disabled{cursor:default}
.opt-btn.correct{background:rgba(79,157,105,.18); border-color:var(--certo); color:#b8e4c4}
.opt-btn.incorrect{background:rgba(181,83,63,.18); border-color:var(--errado); color:#f0bdb0}
.opt-btn.sel-blank{background:rgba(107,124,147,.2); border-color:var(--blank); color:#c5d0de}
.blank-btn{
  width:100%; margin-top:4px; padding:12px; border-radius:10px;
  border:1px dashed var(--line); background:transparent; color:var(--ink-dim);
  font-weight:700; font-size:14px; cursor:pointer;
}
.blank-btn:hover:not(:disabled){border-color:var(--gold); color:var(--gold)}
.blank-btn:disabled{cursor:default; opacity:.55}
.blank-btn.sel{border-style:solid; border-color:var(--blank); color:#c5d0de; background:rgba(107,124,147,.15)}

.feedback{
  margin-top:16px; margin-bottom:8px; padding:14px 16px; border-radius:8px;
  font-size:14.5px; line-height:1.55; display:none;
}
.feedback.show{display:block; animation:pop .22s ease}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.feedback.ok{background:rgba(79,157,105,.1); border-left:3px solid var(--certo)}
.feedback.no{background:rgba(181,83,63,.1); border-left:3px solid var(--errado)}
.feedback.blank{background:rgba(107,124,147,.12); border-left:3px solid var(--blank)}
.feedback .tag{display:block; font-weight:800; letter-spacing:.4px; margin-bottom:6px; font-size:13px; text-transform:uppercase}
.feedback.ok .tag{color:var(--certo)} .feedback.no .tag{color:var(--errado)} .feedback.blank .tag{color:var(--blank)}
.feedback .gab{display:inline-block; background:var(--bg); border:1px solid var(--line); border-radius:5px; padding:1px 7px; font-weight:800; margin-right:6px; font-size:12px}
.feedback .art{color:var(--gold); font-style:italic}

.navb{
  position:fixed; left:0; right:0; bottom:0; z-index:15;
  background:rgba(13,27,46,.94); backdrop-filter:blur(8px);
  border-top:1px solid var(--line);
  padding:10px 14px calc(10px + var(--safe-b));
}
.navb .in{max-width:780px; margin:0 auto; display:flex; gap:10px}
.navb button{
  flex:1; border:0; border-radius:10px; padding:14px 10px;
  font-size:15px; font-weight:800; cursor:pointer; font-family:var(--sans);
}
#btnPrev{background:var(--bg-2); color:var(--ink); border:1px solid var(--line); flex:0 0 36%}
#btnNext{background:var(--gold); color:#2a1f05}
#btnNext:hover{background:#dab663}
.navb button:disabled{opacity:.4; cursor:default}

.intro-card{text-align:center; padding:28px 18px}
.intro-card .sec-label{font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:var(--gold); margin-bottom:6px}
.intro-card h2{font-family:var(--serif); font-size:clamp(22px,5vw,28px); margin:6px 0 8px}
.intro-card p{color:var(--ink-dim); margin:6px 0}
.intro-card .start-btn{
  display:block; width:100%; margin-top:18px; padding:16px;
  border:0; border-radius:10px; background:var(--gold); color:#2a1f05;
  font-weight:800; font-size:16px; cursor:pointer;
}
.howto{font-size:13.5px; color:var(--ink-dim); margin-top:12px}
.howto b{color:var(--ink)}
.demo-banner{
  background:rgba(201,162,74,.12); border:1px dashed var(--gold); color:var(--gold);
  border-radius:8px; padding:10px 12px; font-size:13px; margin-bottom:14px; text-align:center;
}

#finalScreen{display:none}
#finalScreen .card{padding:28px 18px; text-align:center}
#finalScreen h2{font-family:var(--serif); font-size:26px; margin:0 0 6px}
#finalScreen .pct{font-family:var(--serif); font-size:52px; color:var(--gold); margin:10px 0 4px}
#finalScreen .msg{color:var(--ink-dim); margin-bottom:16px; font-size:15px}
.kpis{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin:14px 0}
.kpi{border-radius:10px; padding:12px; text-align:center; font-weight:700; color:#fff}
.kpi b{display:block; font-family:var(--serif); font-size:1.8rem; line-height:1.1}
.kpi.ok{background:var(--certo)} .kpi.bad{background:var(--errado)}
.kpi.bl{background:var(--blank)} .kpi.nota{background:#5b4a9e}
table.pt{width:100%; border-collapse:collapse; margin:12px 0; font-size:14px}
table.pt th,table.pt td{padding:8px 4px; text-align:center; border-bottom:1px solid var(--line)}
table.pt th{color:var(--ink-dim); font-size:11px; text-transform:uppercase; letter-spacing:.5px}
.flag{margin:8px 0; padding:11px 12px; border-radius:10px; font-weight:700; color:#fff; text-align:left; font-size:14px}
.flag.okf{background:var(--certo)} .flag.badf{background:var(--errado)}
.action-btn{
  display:block; width:100%; margin-top:10px; padding:14px;
  border-radius:10px; font-weight:800; font-size:15px; cursor:pointer; font-family:var(--sans);
}
.action-btn.ghost{background:transparent; border:1px solid var(--gold); color:var(--gold)}
.action-btn.solid{background:var(--gold); border:0; color:#2a1f05}
.action-btn.danger{background:rgba(181,83,63,.2); border:1px solid var(--errado); color:#f0bdb0}

#reviewList{text-align:left; margin-top:20px; border-top:1px solid var(--line); padding-top:16px}
.review-item{padding:10px 0; border-bottom:1px solid rgba(255,255,255,.05); font-size:13.5px; display:flex; gap:10px}
.review-item .dot{flex-shrink:0; width:8px; height:8px; border-radius:50%; margin-top:5px}
.review-item.ok .dot{background:var(--certo)}
.review-item.no .dot{background:var(--errado)}
.review-item.bl .dot{background:var(--blank)}
.review-item .rtext{color:var(--ink-dim)}
.review-item .mark{font-weight:800; margin-right:4px}

#welcome{
  position:fixed; inset:0; background:rgba(8,14,24,.88); z-index:60;
  display:none; align-items:center; justify-content:center; padding:16px;
}
#welcome .wc{
  background:var(--panel); border:1px solid var(--line); border-radius:16px;
  max-width:420px; width:100%; padding:22px; text-align:center;
  box-shadow:0 16px 40px rgba(0,0,0,.45);
}
#welcome h3{margin:0 0 8px; font-family:var(--serif); color:var(--gold); font-size:1.35rem}
#welcome p{color:var(--ink-dim); margin:0 0 14px}
#welcome button{display:block; width:100%; margin:8px 0 0; padding:14px; border-radius:10px; border:0; font-size:15px; font-weight:800; cursor:pointer}
#wGo{background:var(--gold); color:#2a1f05}
#wReset{background:rgba(181,83,63,.2); color:#f0bdb0; border:1px solid var(--errado)!important}

#menu{display:none; position:fixed; inset:0; z-index:40; background:rgba(8,14,24,.75)}
#menu .pnl{
  background:var(--panel); max-width:420px; margin:70px auto 0; border-radius:14px;
  padding:10px; box-shadow:0 10px 30px rgba(0,0,0,.5); max-height:80vh; overflow:auto;
  border:1px solid var(--line);
}
#menu button{
  display:flex; justify-content:space-between; width:100%; border:0;
  background:var(--bg-2); margin:6px 0; padding:13px 14px; border-radius:10px;
  font-size:14px; font-weight:700; cursor:pointer; text-align:left; color:var(--ink);
  border-left:6px solid var(--gold);
}
#menu small{font-weight:500; color:var(--ink-dim)}

footer{text-align:center; color:var(--ink-dim); font-size:12px; margin:28px 0 12px; opacity:.75}
.hidden{display:none!important}
.kbd-hint{font-size:11px; color:var(--ink-dim); text-align:center; margin-top:8px; opacity:.7}

/* Long texto-base: scrollable when expanded */
.ctx details[open], details.ctx[open]{
  /* details itself */
}
details.ctx[open]{
  max-height:none;
}
details.ctx .ctx-scroll{
  max-height:min(42vh, 360px);
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding-right:4px;
  margin-top:4px;
}
details.ctx summary{list-style:none}
details.ctx summary::-webkit-details-marker{display:none}
details.ctx summary::before{content:'▸ '; color:var(--gold)}
details.ctx[open] summary::before{content:'▾ '}

/* Always leave room for fixed FS button */
header{padding-right:56px}

@media (max-width:480px){
  .card{padding:18px 14px 16px}
  .qtext{font-size:17px; line-height:1.7}
  .comando{font-size:14px}
  .opt-btn{font-size:16px; padding:14px 8px; min-height:56px}
  .blank-btn{padding:12px; font-size:14.5px}
  header{padding:12px 52px 10px 12px}
  .badge{width:40px;height:40px;font-size:16px;margin-bottom:6px}
  h1{font-size:clamp(17px,5vw,22px)}
  .subtitle{font-size:11px; letter-spacing:1.1px}
  .lawref{font-size:12px; margin-top:4px}
  .scoreboard{gap:6px; margin-bottom:12px}
  .score-box{padding:8px 6px}
  .score-box .num{font-size:18px}
  .progress-wrap{margin-bottom:10px}
  main{padding:12px 12px 0}
  .navb .in{max-width:100%}
  body{padding-bottom:calc(128px + var(--safe-b))}
  .kbd-hint{margin-bottom:4px}
}
@media (min-width:481px) and (max-width:899px){
  .qtext{font-size:17px; line-height:1.68}
}
@media (min-width:900px){
  .navb .in{max-width:900px}
  body.is-immersive .navb .in, :fullscreen .navb .in, :-webkit-full-screen .navb .in{max-width:min(1100px,96vw)}
}

/* --- Mini-Raio combinado: destaque + gabarito comentado --- */
mark.hl{background:rgba(201,162,74,.28);color:#ffe3a3;font-weight:700;border-bottom:2px solid var(--errado);padding:0 2px;border-radius:3px}
.trecho{margin-top:8px;font-size:13.5px;color:#f0bdb0}
.ggrid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:10px 0}
.gcell{border:1px solid var(--line);border-radius:6px;text-align:center;padding:4px 0;font-size:13px;line-height:1.2}
.gcell span{display:block;color:var(--gold);font-size:10.5px}
.gcell.C{background:rgba(79,157,105,.18)} .gcell.C b{color:#b8e4c4}
.gcell.E{background:rgba(181,83,63,.2)} .gcell.E b{color:#f0bdb0}
.gitem{border-left:4px solid var(--certo);padding:16px 16px 14px}
.gitem.E{border-left-color:var(--errado)}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.pill{font-size:11px;font-weight:800;letter-spacing:.8px;padding:3px 10px;border-radius:999px;color:#fff;white-space:nowrap}
.pill.C{background:var(--certo)} .pill.E{background:var(--errado)}
.gtxt{font-size:15.5px;line-height:1.6}
.gcom{margin-top:10px;background:var(--bg-2);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--ink-dim)}
.gcom b{color:var(--ink)}
.gyour{margin-top:8px;font-size:12.5px;color:var(--ink-dim)}
.gab-nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.gab-title{font-family:var(--serif);margin:0 0 6px;font-size:22px;text-align:center}
.gab-sec{font-family:var(--serif);margin:0 0 4px;font-size:20px}
.gab-note{color:var(--ink-dim);font-size:13.5px;margin:6px 0}
.gab-tot{font-size:13px;color:var(--ink-dim);margin:4px 0 0}
table.pt td:first-child{text-align:left}
</style>
</head>
<body>
<button class="fs-btn" id="fsBtn" type="button" title="Tela cheia (F)" aria-label="Tela cheia">⛶</button>
<header>
  <div class="badge">PM</div>
  <h1 id="docTitle">Mini-Raio PMMA 2026 — História do Maranhão + História do Brasil</h1>
  <div class="subtitle" id="docSubtitle"></div>
  <div class="lawref" id="docLawref"></div>
  <div class="hdr-meta">
    <span class="chip" id="posChip"></span>
    <span class="chip gold" id="marcoChip"></span>
    <button class="chip" id="menuBtn" type="button">☰ Seções</button>
  </div>
</header>

<main>
  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">0 / 0</div>
  </div>
  <div class="scoreboard">
    <div class="score-box"><div class="num" id="numCertas">0</div><div class="lbl">Certas</div></div>
    <div class="score-box"><div class="num" id="numErradas">0</div><div class="lbl">Erradas</div></div>
    <div class="score-box"><div class="num" id="numPendentes">0</div><div class="lbl">Restantes</div></div>
  </div>
  <div id="quizBody"></div>
</main>

<div class="navb hidden" id="navb">
  <div class="in">
    <button type="button" id="btnPrev">← Anterior</button>
    <button type="button" id="btnNext">Próxima →</button>
  </div>
</div>

<div id="welcome"><div class="wc">
  <h3>Bem-vindo de volta!</h3>
  <p id="wMsg"></p>
  <button type="button" id="wGo"></button>
  <button type="button" id="wReset">Recomeçar do zero</button>
</div></div>

<div id="menu"><div class="pnl" id="menuP"></div></div>

<footer id="docFooter">Mini-Raio PMMA 2026 · História do Maranhão + História do Brasil · 60 itens · offline · Modelo Simulado PMMA</footer>

<script>
/* Mini-Raio PMMA 2026 — História do Maranhão + História do Brasil · 60 itens · gabarito oficial dos PDFs
 * ids internos 1–60; 'num' = número original do item dentro da matéria (1–30). 'hl' = trecho que torna o item ERRADO. */
window.SIM_CONFIG = {
  "TITLE": "Mini-Raio PMMA 2026 — História do Maranhão + História do Brasil",
  "SUBTITLE": "Certo & Errado · 60 itens · 2 matérias",
  "LAWREF": "Estilo CEBRASPE · nível alto · treino de recuperação",
  "STORAGE_KEY": "miniraio_historia_ma_br_pmma_v1",
  "DEMO": false,
  "REVERSE_ORDER": true,
  "SECTIONS": [
    {
      "name": "História do Maranhão",
      "short": "História do MA",
      "a": 1,
      "b": 30
    },
    {
      "name": "História do Brasil",

(function(){
  'use strict';
  const C = window.SIM_CONFIG;
  const Q = window.QUESTIONS;
  const N = Q.length;
  const KEY = C.STORAGE_KEY || 'modelo_simulado_pmma';
  const SC = Object.assign({
    mode: 'cebraspe', // 'percent' | 'cebraspe'
    allowBlank: true,
    p1: null, // {from,to,min} or null
    p2: null,
    totalMin: null
  }, C.SCORING || {});

  // Build SECTIONS from config or derive from questions
  let SECTIONS = (C.SECTIONS && C.SECTIONS.length) ? C.SECTIONS.slice() : [];
  if (!SECTIONS.length) {
    const map = new Map();
    Q.forEach((q,i)=>{
      const name = q.section || 'Geral';
      if (!map.has(name)) map.set(name, {name, a:i+1, b:i+1});
      else map.get(name).b = i+1;
    });
    SECTIONS = [...map.values()];
  }

  const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));

  let st = {marks:{}, last:null};
  try {
    const raw = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (raw && typeof raw === 'object') {
      st.marks = raw.marks || {};
      st.last = raw.last || null;
    }
  } catch(e){}

  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e){} };
  const $ = id => document.getElementById(id);
  const secIdx = n => SECTIONS.findIndex(s => n >= s.a && n <= s.b);
  const secOf = n => SECTIONS[Math.max(0, secIdx(n))] || {name:'', a:1, b:N};

  const dn = n => (Q[n-1] && Q[n-1].num) || n;
  const lbl = n => { const s = secOf(n); return (s.short || s.name) + ' · item ' + dn(n); };
  function hlText(q){ let t = esc(q.texto); (q.hl||[]).forEach(s => { const e = esc(s); t = t.split(e).join('<mark class="hl">'+e+'</mark>'); }); return t; }
  function trechoHtml(q){
    if (q.resposta !== 'E' || !q.hl || !q.hl.length) return '';
    return '<div class="trecho">✗ Trecho que torna o item errado: ' + q.hl.map(s => '<mark class="hl">“'+esc(s)+'”</mark>').join(' · ') + '</div>';
  }
  function secTable(){
    const row = (name,a,b) => {
      let ac=0, er=0, bl=0;
      for (let n=a; n<=b; n++){ const v = st.marks[n]; if (v==='C'||v==='E'){ (v===Q[n-1].resposta) ? ac++ : er++; } else bl++; }
      const t = b-a+1;
      return '<tr><td><b>'+esc(name)+'</b></td><td>'+ac+'</td><td>'+er+'</td><td>'+bl+'</td><td><b>'+(ac-er)+'</b></td><td>'+Math.round(ac/t*100)+'%</td></tr>';
    };
    let rows = SECTIONS.map(s => row(s.short||s.name, s.a, s.b)).join('') + row('Total', 1, N);
    return '<div style="font-family:var(--serif);font-size:15px;margin:14px 0 2px;text-align:left">Desempenho por matéria</div>' +
      '<table class="pt" id="secTable"><tr><th></th><th>Acertos</th><th>Erros</th><th>Branco</th><th>Nota</th><th>%</th></tr>'+rows+'</table>';
  }
  function renderGab(){
    $('navb').classList.add('hidden');
    let h = '<div class="card"><h2 class="gab-title">📖 Gabarito comentado</h2>' +
      '<p class="gab-note">Gabarito oficial dos PDFs (Mini-Raio PMMA 2026). Nos itens <b>ERRADO</b>, o trecho que torna a afirmação falsa aparece <mark class="hl">destacado</mark>. Os comentários são explicativos (o PDF original traz apenas o gabarito).</p>' +
      '<div class="gab-nav">' + SECTIONS.map((s,i) => '<button class="chip gold" type="button" data-gs="'+i+'">'+esc(s.name)+'</button>').join('') + '</div></div>';
    SECTIONS.forEach((s,i) => {
      let nc=0, ne=0, cells='';
      for (let n=s.a; n<=s.b; n++){ const r = Q[n-1].resposta; (r==='C') ? nc++ : ne++; cells += '<div class="gcell '+r+'"><span>'+String(dn(n)).padStart(2,'0')+'</span><b>'+r+'</b></div>'; }
      h += '<div class="card" id="gabsec'+i+'"><div class="qnum">Gabarito · itens '+dn(s.a)+'–'+dn(s.b)+'</div><h3 class="gab-sec">'+esc(s.name)+'</h3>' +
        '<div class="ggrid">'+cells+'</div><p class="gab-tot"><b style="color:var(--certo)">'+nc+' CERTO</b> · <b style="color:var(--errado)">'+ne+' ERRADO</b></p></div>';
      for (let n=s.a; n<=s.b; n++){
        const q = Q[n-1], r = q.resposta, v = st.marks[n];
        let your = '';
        if (v==='C'||v==='E') your = '<div class="gyour">Sua resposta: '+(v==='C'?'CERTO':'ERRADO')+' '+(v===r?'<span style="color:var(--certo)">✓ (+1)</span>':'<span style="color:var(--errado)">✗ (−1)</span>')+'</div>';
        else if (v==='B') your = '<div class="gyour">Sua resposta: em branco (0)</div>';
        h += '<div class="card gitem '+r+'"><div class="ghead"><span class="qnum" style="margin:0">Item '+String(dn(n)).padStart(2,'0')+' · '+esc(s.short||s.name)+'</span><span class="pill '+r+'">'+(r==='C'?'CERTO':'ERRADO')+'</span></div>' +
          '<div class="gtxt">'+hlText(q)+'</div>'+trechoHtml(q)+'<div class="gcom"><b>Comentário:</b> '+esc(q.comentario||'')+'</div>'+your+'</div>';
      }
    });
    h += '<button class="action-btn solid" id="gabToPlacar" type="button">🏁 Ir para o placar</button>' +
         '<button class="action-btn ghost" id="gabToStart" type="button">← Voltar ao início</button>';
    $('quizBody').innerHTML = h;
    $('quizBody').querySelectorAll('[data-gs]').forEach(b => { b.onclick = () => { const el = $('gabsec'+b.dataset.gs); if (el) el.scrollIntoView({behavior:'smooth', block:'start'}); }; });
    $('gabToPlacar').onclick = () => go({t:'placar'});
    $('gabToStart').onclick = () => go({t:'intro', s: REVERSE ? Math.max(0, SECTIONS.length-1) : 0});
  }

  // Inherit base-text / comando context within a section group
  const CTX = [];
  Q.forEach((q,i)=>{
    const s = secOf(q.id || (i+1));
    const n = q.id || (i+1);
    if (q.pre && q.pre.length) CTX[i] = {src:n, pre:q.pre};
    else if (q.separator || n === s.a) CTX[i] = null;
    else CTX[i] = CTX[i-1] || null;
  });

  const REVERSE = !!C.REVERSE_ORDER;
  let view = {t:'intro', s: REVERSE ? Math.max(0, SECTIONS.length-1) : 0}; // intro | item | placar

  function counts(a,b){
    let ac=0, er=0, bl=0;
    for (let n=a; n<=b; n++){
      const v = st.marks[n];
      const q = Q[n-1];
      if (!q) continue;
      if (v==='C' || v==='E'){
        (v === q.resposta ? ac++ : er++);
      } else if (v==='B') bl++;
      else bl++; // unanswered counts as blank for scoring display of remaining range
    }
    // For live scoreboard we treat unanswered separately; for placar blanks include unanswered
    return {ac, er, bl, nota: ac - er};
  }
  function answeredCount(){
    return Object.keys(st.marks).filter(k => st.marks[k]==='C'||st.marks[k]==='E'||st.marks[k]==='B').length;
  }
  function liveScore(){
    let ac=0, er=0;
    Object.keys(st.marks).forEach(k=>{
      const v = st.marks[k];
      if (v!=='C' && v!=='E') return;
      const q = Q[+k-1];
      if (!q) return;
      if (v === q.resposta) ac++; else er++;
    });
    return {ac, er, rest: N - answeredCount()};
  }

  function setLast(n){
    const s = secOf(n);
    st.last = {n, sec: s.name};
    save();
  }

  function go(v){
    view = v;
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  }

  function headerBar(){
    const live = liveScore();
    $('numCertas').textContent = live.ac;
    $('numErradas').textContent = live.er;
    $('numPendentes').textContent = live.rest;
    if (view.t === 'item'){
      const n = view.n;
      const s = secOf(n);
      const donePos = REVERSE ? (N - n + 1) : n;
      $('progressLabel').textContent = donePos + ' / ' + N;
      $('progressFill').style.width = (donePos / N * 100) + '%';
      $('posChip').textContent = (s.short || s.name) + ' · item ' + dn(n) + (REVERSE ? ' (decrescendo)' : '');
    } else if (view.t === 'intro'){
      const s = SECTIONS[view.s];
      const tip = REVERSE ? s.b : (s.a-1);
      const donePos = REVERSE ? (N - s.b) : (s.a-1);
      $('progressLabel').textContent = Math.max(0,donePos) + ' / ' + N;
      $('progressFill').style.width = (Math.max(0,donePos) / N * 100) + '%';
      $('posChip').textContent = 'Seção: ' + (s.short || s.name);
    } else {
      $('progressLabel').textContent = answeredCount() + ' / ' + N + ' respondidos';
      $('progressFill').style.width = '100%';
      $('posChip').textContent = view.t === 'gab' ? 'Gabarito comentado' : 'Placar final';
    }
    $('marcoChip').textContent = st.last ? ('📌 Marco: ' + lbl(st.last.n)) : '';
  }

  function renderCtx(n){
    const ctx = CTX[n-1];
    if (!ctx) return '';
    const body = ctx.pre.map(p => {
      const cls = p.cls || 'txt';
      return '<p class="'+esc(cls)+'">'+esc(p.t)+'</p>';
    }).join('');
    const len = ctx.pre.reduce((a,p)=>a+(p.t||'').length, 0);
    if (len > 280){
      const open = ctx.src === n ? ' open' : '';
      const sum = ctx.src === n
        ? '📄 Texto-base / comando (toque para recolher)'
        : '📄 Texto-base / comando (do item '+ctx.src+') — toque para ver';
      return '<details class="ctx"'+open+'><summary>'+sum+'</summary><div class="ctx-scroll">'+body+'</div></details>';
    }
    return '<div class="ctx">'+body+'</div>';
  }

  function showFb(n){
    const q = Q[n-1], v = st.marks[n];
    if (!v){ $('fb').className='feedback'; $('fb').innerHTML=''; return; }
    let cls, tag;
    if (v === 'B'){ cls='blank'; tag='— Em branco (0 ponto)'; }
    else if (v === q.resposta){ cls='ok'; tag='✓ Você acertou' + (SC.mode==='cebraspe'?' (+1)':''); }
    else { cls='no'; tag='✗ Você errou' + (SC.mode==='cebraspe'?' (−1)':''); }
    const gab = q.resposta === 'C' ? 'CERTO' : 'ERRADO';
    const art = q.art ? ' <span class="art">'+esc(q.art)+'</span>' : '';
    const warn = q.discutivel ? ' ⚠️ ' : '';
    $('fb').className = 'feedback show ' + cls;
    $('fb').innerHTML =
      '<span class="tag">'+tag+'</span>' +
      '<span class="gab">'+gab+'</span>' + art +
      trechoHtml(q) +
      '<div style="margin-top:8px">'+warn+esc(q.comentario||'')+'</div>';
  }

  function mark(n, v){
    if (st.marks[n]) return;
    st.marks[n] = v;
    setLast(n);
    save();
    render();
    // scroll feedback into view
    setTimeout(()=>{ const el=$('fb'); if(el) el.scrollIntoView({behavior:'smooth', block:'nearest'}); }, 50);
  }

  function renderIntro(){
    const s = SECTIONS[view.s];
    const c = counts(s.a, s.b);
    const total = s.b - s.a + 1;
    const ans = total - c.bl;
    const demo = C.DEMO ? '<div class="demo-banner">⚠️ DEMO — estes itens de exemplo serão substituídos ao colar o PDF convertido</div>' : '';
    const firstSec = REVERSE ? (SECTIONS.length-1) : 0;
    const howto = view.s === firstSec ? (
      '<div class="card howto"><b>Como funciona:</b> uma questão por vez'+(REVERSE?' (ordem invertida: cada matéria do item 30 ao 1, começando por '+esc(SECTIONS[SECTIONS.length-1].name)+')':'')+'. Toque em <b>Certo</b>, <b>Errado</b>' +
      (SC.allowBlank ? ' ou <b>Deixar em branco</b>' : '') +
      '; o gabarito comentado aparece logo abaixo. Depois toque em <b>Próxima →</b>. ' +
      'O progresso fica salvo neste aparelho' +
      (SC.mode==='cebraspe' ? '. No fim: placar Cebraspe (acerto +1, erro −1, branco 0).' : '.') +
      '</div>'
    ) : '';
    const startN = REVERSE ? s.b : s.a;
    const gabBtn = view.s === firstSec ? '<button class="action-btn ghost" id="gabBtnStart" type="button" style="font-size:13.5px;padding:10px">📖 Ver gabarito comentado <small>(contém as respostas)</small></button>' : '';
    const orderHint = REVERSE ? (' · ordem '+dn(s.b)+'→'+dn(s.a)) : '';
    let backHtml = '';
    if (REVERSE){
      if (view.s < SECTIONS.length-1) backHtml = '<button class="action-btn ghost" id="backSec">← Voltar ao '+lbl(s.b+1)+'</button>';
    } else if (view.s>0){
      backHtml = '<button class="action-btn ghost" id="backSec">← Voltar ao '+lbl(s.a-1)+'</button>';
    }
    $('quizBody').innerHTML =
      demo +
      '<div class="card intro-card">' +
      '<div class="sec-label">Seção '+(REVERSE ? (SECTIONS.length-view.s) : (view.s+1))+' de '+SECTIONS.length+'</div>' +
      '<h2>'+esc(s.name)+'</h2>' +
      '<p>Itens '+dn(s.a)+'–'+dn(s.b)+' · '+total+' itens'+orderHint+(ans?(' · '+ans+' já respondidos'):'')+'</p>' +
      '<button class="start-btn" id="startSec">Começar ▶ item '+dn(startN)+'</button>' +
      '</div>' + howto + gabBtn + backHtml;
    $('navb').classList.add('hidden');
    $('startSec').onclick = () => go({t:'item', n:startN});
    if ($('gabBtnStart')) $('gabBtnStart').onclick = () => go({t:'gab'});
    const back = $('backSec');
    if (back) back.onclick = () => go({t:'item', n: REVERSE ? (s.b+1) : (s.a-1)});
  }

  function renderItem(){
    const n = view.n;
    const q = Q[n-1];
    setLast(n);
    const v = st.marks[n];
    const locked = !!v;
    let h = renderCtx(n);
    h += '<div class="card">';
    h += '<div class="qnum">Item '+dn(n)+(q.section?(' · '+esc(q.section)):'')+'</div>';
    if (q.comando) h += '<div class="comando">'+esc(q.comando)+'</div>';
    if (q.discutivel) h += '<span class="warn">⚠️ item discutível</span>';
    h += '<div class="qtext">'+(locked ? hlText(q) : esc(q.texto))+'</div>';
    h += '<div class="options">';
    h += '<button class="opt-btn'+(v==='C'?(q.resposta==='C'?' correct':' incorrect'):(locked&&q.resposta==='C'?' correct':''))+'" data-v="C"'+(locked?' disabled':'')+'>CERTO</button>';
    h += '<button class="opt-btn'+(v==='E'?(q.resposta==='E'?' correct':' incorrect'):(locked&&q.resposta==='E'?' correct':''))+'" data-v="E"'+(locked?' disabled':'')+'>ERRADO</button>';
    h += '</div>';
    if (SC.allowBlank){
      h += '<button class="blank-btn'+(v==='B'?' sel':'')+'" data-v="B"'+(locked?' disabled':'')+'>Deixar em branco</button>';
    }
    h += '<div class="feedback" id="fb"></div>';
    h += '<p class="kbd-hint">Atalhos: C · E'+(SC.allowBlank?' · B':'')+' · ← → · F (tela cheia)</p>';
    h += '</div>';
    $('quizBody').innerHTML = h;
    $('navb').classList.remove('hidden');
    $('btnPrev').disabled = REVERSE ? (n === N) : (n === 1);
    $('btnNext').textContent = (REVERSE ? (n === 1) : (n === N)) ? 'Ver placar 🏁' : 'Próxima →';
    if (v) showFb(n);
    $('quizBody').querySelectorAll('[data-v]').forEach(b=>{
      b.onclick = () => mark(n, b.dataset.v);
    });
  }

  function renderPlacar(){
    $('navb').classList.add('hidden');
    const T = counts(1, N);
    // Recalc blanks as only explicit B + unanswered for display of "em branco"
    let ac=T.ac, er=T.er, bl=0;
    for (let n=1;n<=N;n++){
      const v=st.marks[n];
      if (v!=='C' && v!=='E') bl++;
    }
    const nota = ac - er;
    const pct = N ? Math.round((ac/N)*100) : 0;

    let table = '';
    let flags = '';
    if (SC.p1 || SC.p2){
      const rows = [];
      const mk = (label, range, min) => {
        if (!range) return;
        const c = counts(range.from, range.to);
        let blank=0; for(let n=range.from;n<=range.to;n++){ const v=st.marks[n]; if(v!=='C'&&v!=='E') blank++; }
        rows.push('<tr><td><b>'+esc(label)+'</b></td><td>'+c.ac+'</td><td>'+c.er+'</td><td>'+blank+'</td><td><b>'+(c.ac-c.er)+'</b></td><td>'+(min!=null?min:'—')+'</td></tr>');
        if (min != null){
          const ok = (c.ac-c.er) >= min;
          flags += '<div class="flag '+(ok?'okf':'badf')+'">'+(ok?'✅':'❌')+' '+esc(label)+': nota '+(c.ac-c.er)+' '+(ok?'≥':'<')+' '+min+' — '+(ok?'não eliminado':'ELIMINADO')+'</div>';
        }
      };
      mk('P1 ('+SC.p1.from+'–'+SC.p1.to+')', SC.p1, SC.p1.min);
      if (SC.p2) mk('P2 ('+SC.p2.from+'–'+SC.p2.to+')', SC.p2, SC.p2.min);
      mk('Total', {from:1,to:N}, SC.totalMin);
      table = '<table class="pt"><tr><th></th><th>Acertos</th><th>Erros</th><th>Branco</th><th>Nota</th><th>Mín.</th></tr>'+rows.join('')+'</table>';
      if (SC.totalMin != null){
        const ok = nota >= SC.totalMin;
        // already added in mk Total
      }
    }

    let review = '<div id="reviewList"><div style="font-family:var(--serif);font-size:15px;margin-bottom:10px;color:var(--ink)">Revisão dos itens'+(REVERSE?' (ordem do simulado)':'')+'</div>';
    const revIdx = REVERSE ? [...Q.keys()].reverse() : [...Q.keys()];
    revIdx.forEach(i=>{
      const q=Q[i], n=i+1, v=st.marks[n];
      let cls='bl', mark='—';
      if (v==='C'||v==='E'){ cls = (v===q.resposta)?'ok':'no'; mark = (v===q.resposta)?'✓':'✗'; }
      else if (v==='B'){ cls='bl'; mark='○'; }
      const snippet = (q.texto||'').slice(0,110) + ((q.texto||'').length>110?'…':'');
      review += '<div class="review-item '+cls+'"><div class="dot"></div><div class="rtext"><span class="mark">'+mark+'</span><strong>'+esc(secOf(n).short||'')+' · Item '+dn(n)+'</strong>'+(q.art?(' ('+esc(q.art)+')'):'')+': '+esc(snippet)+'</div></div>';
    });
    review += '</div>';

    const scoreLine = SC.mode==='cebraspe'
      ? (ac+' acertos − '+er+' erros = <b>nota '+nota+'</b> · '+bl+' em branco')
      : (ac+' de '+N+' corretos');

    $('quizBody').innerHTML =
      '<div class="card" id="finalScreenInner">' +
      '<h2 style="font-family:var(--serif);margin:0 0 4px">Simulado concluído</h2>' +
      '<div class="pct">'+pct+'%</div>' +
      '<div style="font-size:12px;color:var(--ink-dim);margin-bottom:6px">aproveitamento (acertos ÷ '+N+' itens) · nota líquida '+nota+' de '+N+' ('+Math.round(nota/N*100)+'%)</div>' +
      '<div class="msg">'+scoreLine+'</div>' +
      '<div class="kpis">' +
      '<div class="kpi ok"><b>'+ac+'</b>Acertos</div>' +
      '<div class="kpi bad"><b>'+er+'</b>Erros</div>' +
      '<div class="kpi bl"><b>'+bl+'</b>Em branco</div>' +
      '<div class="kpi nota"><b>'+(SC.mode==='cebraspe'?nota:pct+'%')+'</b>'+(SC.mode==='cebraspe'?'Nota líquida':'Aproveitamento')+'</div>' +
      '</div>' +
      secTable() + table + flags +
      (SC.mode==='cebraspe'?'<p style="font-size:13px;color:var(--ink-dim);text-align:left">Nota = acertos − erros. Em branco vale 0.</p>':'') +
      '<button class="action-btn solid" id="gabBtn" type="button">📖 Ver gabarito comentado</button>' +
      '<button class="action-btn ghost" id="revBtn">← Rever a partir do item 1</button>' +
      '<button class="action-btn danger" id="redoBtn">🔄 Refazer do zero</button>' +
      review +
      '</div>';
    $('finalScreenInner'); // ensure
    $('gabBtn').onclick = () => go({t:'gab'});
    $('revBtn').onclick = () => go({t:'item', n: REVERSE ? N : 1});
    $('redoBtn').onclick = () => { if (resetAll()) go({t:'intro', s: REVERSE ? Math.max(0, SECTIONS.length-1) : 0}); };
  }

  function render(){
    headerBar();
    if (view.t === 'intro') renderIntro();
    else if (view.t === 'placar') renderPlacar();
    else if (view.t === 'gab') renderGab();
    else renderItem();
  }

  function next(){
    if (view.t !== 'item') return;
    const n = view.n;
    if (REVERSE){
      if (n === 1) return go({t:'placar'});
      const s1 = secIdx(n), s2 = secIdx(n-1);
      if (s2 !== s1 && s2 >= 0) go({t:'intro', s:s2});
      else go({t:'item', n:n-1});
    } else {
      if (n === N) return go({t:'placar'});
      const s1 = secIdx(n), s2 = secIdx(n+1);
      if (s2 !== s1 && s2 >= 0) go({t:'intro', s:s2});
      else go({t:'item', n:n+1});
    }
  }
  function prev(){
    if (view.t !== 'item') return;
    if (REVERSE){
      if (view.n < N) go({t:'item', n:view.n+1});
    } else {
      if (view.n > 1) go({t:'item', n:view.n-1});
    }
  }

  function resetAll(){
    if (!confirm('Apagar todas as respostas e o marco salvo deste simulado?')) return false;
    st = {marks:{}, last:null};
    save();
    return true;
  }

  // Menu
  
  const fsBtn = $('fsBtn');
  function apiFs(){
    return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
  }
  function immersiveOn(){ return document.body.classList.contains('is-immersive'); }
  function isFs(){ return apiFs() || immersiveOn(); }
  function unlockScroll(){
    const root = document.documentElement;
    root.style.overflowY = 'auto';
    root.style.height = 'auto';
    root.style.maxHeight = 'none';
    document.body.style.overflowY = 'auto';
    document.body.style.overflowX = 'hidden';
    document.body.style.position = 'static';
    document.body.style.top = '';
    document.body.style.left = '';
    document.body.style.right = '';
    document.body.style.bottom = '';
    document.body.style.height = 'auto';
    document.body.style.maxHeight = 'none';
    document.body.style.touchAction = 'pan-y';
  }
  function enterImmersive(){
    document.body.classList.add('is-immersive');
    unlockScroll();
  }
  function exitImmersive(){
    document.body.classList.remove('is-immersive');
    unlockScroll();
  }
  function syncFsBtn(){
    if(!fsBtn) return;
    const on = isFs();
    fsBtn.title = on ? 'Sair da tela cheia' : 'Tela cheia';
    fsBtn.setAttribute('aria-label', fsBtn.title);
    fsBtn.textContent = on ? '✕' : '⛶';
    fsBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
  }
  async function enterApiFs(){
    const el = document.documentElement;
    if (el.requestFullscreen) return el.requestFullscreen({ navigationUI: 'hide' }).catch(()=>el.requestFullscreen());
    if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); return; }
    if (el.msRequestFullscreen) { el.msRequestFullscreen(); return; }
    throw new Error('no-fs-api');
  }
  async function exitApiFs(){
    if (document.exitFullscreen) return document.exitFullscreen();
    if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); return; }
    if (document.msExitFullscreen) { document.msExitFullscreen(); return; }
  }
  async function toggleFs(ev){
    if (ev) { ev.preventDefault(); ev.stopPropagation(); }
    const turningOff = isFs();
    if (turningOff){
      try{ await exitApiFs(); }catch(_){}
      exitImmersive();
      syncFsBtn();
      return;
    }
    // Always expand the layout immediately (works even when Fullscreen API is blocked).
    enterImmersive();
    syncFsBtn();
    try{
      await enterApiFs();
    }catch(_){
      /* keep immersive fallback */
    }
    setTimeout(syncFsBtn, 150);
  }
  if (fsBtn){
    fsBtn.addEventListener('click', toggleFs, true);
    fsBtn.addEventListener('pointerup', function(e){ /* ensure gesture */ }, true);
  }
  document.addEventListener('fullscreenchange', ()=>{ unlockScroll(); syncFsBtn(); });
  document.addEventListener('webkitfullscreenchange', syncFsBtn);
  document.addEventListener('MSFullscreenChange', syncFsBtn);
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && immersiveOn() && !apiFs()){ exitImmersive(); syncFsBtn(); }
  });
  syncFsBtn();
  unlockScroll();
  exitImmersive(); // start normal; only expand on demand

  $('menuBtn').onclick = () => {
    $('menuP').innerHTML = SECTIONS.map((s,i)=>{
      const c = counts(s.a, s.b);
      const total = s.b - s.a + 1;
      let done=0; for(let n=s.a;n<=s.b;n++){ if(st.marks[n]==='C'||st.marks[n]==='E'||st.marks[n]==='B') done++; }
      return '<button data-s="'+i+'"><span>'+esc(s.short||s.name)+'</span><small>'+dn(s.a)+'–'+dn(s.b)+' · '+done+'/'+total+'</small></button>';
    }).join('') + '<button data-p="1" style="border-left-color:#facc15"><span>🏁 Placar final</span><small></small></button>' + '<button data-g="1" style="border-left-color:#4f9d69"><span>📖 Gabarito comentado</span><small>contém as respostas</small></button>';
    $('menu').style.display = 'block';
  };
  $('menu').onclick = e => {
    const b = e.target.closest('button');
    $('menu').style.display = 'none';
    if (!b) return;
    if (b.dataset.g) go({t:'gab'});
    else if (b.dataset.p) go({t:'placar'});
    else go({t:'intro', s:+b.dataset.s});
  };
  $('marcoChip').onclick = () => { if (st.last) go({t:'item', n:st.last.n}); };

  $('btnNext').onclick = next;
  $('btnPrev').onclick = prev;

  document.addEventListener('keydown', e => {
    if((e.key==='f'||e.key==='F') && !e.ctrlKey && !e.metaKey && !e.altKey){
      const tag=(e.target&&e.target.tagName)||'';
      if(tag!=='INPUT'&&tag!=='TEXTAREA'){ e.preventDefault(); toggleFs(); }
    }

    if (e.target.closest('input,textarea,select')) return;
    if ($('welcome').style.display === 'flex') return;
    if (view.t === 'item'){
      const k = e.key.toLowerCase();
      if (k === 'c') mark(view.n, 'C');
      else if (k === 'e') mark(view.n, 'E');
      else if (k === 'b' && SC.allowBlank) mark(view.n, 'B');
      else if (e.key === 'ArrowRight') next();
      else if (e.key === 'ArrowLeft') prev();
    } else if (view.t === 'intro' && e.key === 'Enter'){
      const btn = $('startSec'); if (btn) btn.click();
    }
  });

  // Apply titles
  document.title = C.TITLE || 'Simulado PMMA';
  $('docTitle').textContent = C.TITLE || 'Simulado Certo & Errado';
  $('docSubtitle').textContent = C.SUBTITLE || '';
  $('docLawref').textContent = C.LAWREF || '';
  if (!C.LAWREF) $('docLawref').style.display = 'none';

  // Boot: resume?
  const hasProgress = st.last && (answeredCount() || (st.last.n > 1));
  if (hasProgress){
    const w = $('welcome'), L = st.last;
    $('wMsg').innerHTML = 'Você parou no <b>item '+dn(L.n)+'</b> ('+esc(L.sec)+'). Continuar daqui?<br><small>'+answeredCount()+' de '+N+' itens respondidos.</small>';
    $('wGo').textContent = 'Continuar do '+lbl(L.n);
    w.style.display = 'flex';
    $('wGo').onclick = () => { w.style.display='none'; go({t:'item', n:L.n}); };
    $('wReset').onclick = () => { if (resetAll()){ w.style.display='none'; go({t:'intro', s: REVERSE ? Math.max(0, SECTIONS.length-1) : 0}); } };
    // render behind modal
    render();
  } else {
    render();
  }
})();

</script>
</body>
</html>
